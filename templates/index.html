<!DOCTYPE html>
<html>
<head>
    <title>Studio Ghibli Photo Filter</title>
</head>
<body>
    <h1>Upload a Photo to Transform into Studio Ghibli Style</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*">
        <input type="submit" value="Upload and Transform">
    </form>
</body>
</html>
